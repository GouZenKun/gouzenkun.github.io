<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d140e" />
      <stop offset="100%" stop-color="#060a07" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <path d="M -100,100 L 900,100 M -100,200 L 900,200 M -100,300 L 900,300 M -100,400 L 900,400" stroke="#162319" stroke-width="1.5" stroke-dasharray="12 6" />
  <circle cx="400" cy="250" r="110" fill="url(#bg-grad)" stroke="#10b981" stroke-width="2" />
  <circle cx="400" cy="250" r="90" fill="url(#glow-grad)" filter="url(#glow)" />
  <text x="400" y="278" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="75" text-anchor="middle">🇹🇭</text>
  <text x="400" y="440" font-family="Outfit, sans-serif" font-size="30" fill="#f0f4f1" font-weight="700" letter-spacing="6" text-anchor="middle">1880 WATSON &amp; HOLMES</text>
</svg>
